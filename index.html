<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Wprowadź Mnie Panie - Hardcore Edition</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; font-family: 'Georgia', serif; }
#gameCanvas { display: block; margin: 0 auto; background: #111; }
#fullscreenBtn { position: fixed; top: 10px; right: 10px; z-index: 100; background: rgba(255,255,255,0.1); border: 1px solid #444; color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 10px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<button id="fullscreenBtn">⛶ Fullscreen</button>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Skalowanie ---
function resize() {
    const aspect = 9 / 16;
    let h = window.innerHeight, w = h * aspect;
    if (w > window.innerWidth) { w = window.innerWidth; h = w / aspect; }
    canvas.width = Math.floor(w); canvas.height = Math.floor(h);
    canvas.style.position = 'absolute';
    canvas.style.left = ((window.innerWidth - w) / 2) + 'px';
    canvas.style.top = ((window.innerHeight - h) / 2) + 'px';
}
window.addEventListener('resize', resize);
resize();

// --- Dane Poziomów ---
const LEVEL_DATA = [
    { name: "Dziedziniec", wall: "#8e8671", floor: "#f5f0e0", fog: 0 },
    { name: "Krużganki", wall: "#7d6e52", floor: "#e8e0d0", fog: 0 },
    { name: "Ogrody", wall: "#2d4a22", floor: "#c8d8a8", fog: 0 },
    { name: "Biblioteka", wall: "#4a3b2a", floor: "#a89880", fog: 150 },
    { name: "Piwnice", wall: "#2a2825", floor: "#5a5550", fog: 130 },
    { name: "Katedra", wall: "#3a2050", floor: "#6a5a70", fog: 120 },
    { name: "Mechanizm", wall: "#444", floor: "#888070", fog: 110 },
    { name: "Krypta", wall: "#1a1815", floor: "#3a3530", fog: 100 },
    { name: "Lustra", wall: "#507080", floor: "#506070", fog: 90 },
    { name: "Sacrum", wall: "#d0c8b0", floor: "#1a1010", fog: 80 }
];

// --- Generator Labiryntu ---
class Maze {
    constructor(cols, rows) {
        this.cols = cols; this.rows = rows;
        this.grid = Array.from({ length: rows }, () => Array.from({ length: cols }, () => ({
            v: false, walls: [true, true, true, true] // góra, prawo, dół, lewo
        })));
        this.generate(0, 0);
    }
    generate(r, c) {
        this.grid[r][c].v = true;
        const dirs = [[-1, 0, 0, 2], [0, 1, 1, 3], [1, 0, 2, 0], [0, -1, 3, 1]].sort(() => Math.random() - 0.5);
        for (const [dr, dc, wIdx, opp] of dirs) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols && !this.grid[nr][nc].v) {
                this.grid[r][c].walls[wIdx] = false;
                this.grid[nr][nc].walls[opp] = false;
                this.generate(nr, nc);
            }
        }
    }
}

// --- Gracz ---
class Player {
    constructor(cellSize) {
        this.x = 0; this.y = 0;
        this.targetX = 0; this.targetY = 0;
        this.r = cellSize * 0.25; // Jeszcze mniejszy promień dla trudniejszych przejść
        this.speed = 2.8;
    }
    update(maze, cellSize) {
        const dx = this.targetX - this.x, dy = this.targetY - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 1) return;

        const vx = (dx / dist) * this.speed, vy = (dy / dist) * this.speed;

        // Logika kolizji oparta na "ślizganiu" się po krawędziach komórek
        if (!this.checkWall(this.x + vx, this.y, maze, cellSize)) this.x += vx;
        if (!this.checkWall(this.x, this.y + vy, maze, cellSize)) this.y += vy;
    }

    checkWall(nx, ny, maze, cellSize) {
        const buffer = this.r + 2; 
        const points = [
            {x: nx - buffer, y: ny - buffer}, {x: nx + buffer, y: ny - buffer},
            {x: nx - buffer, y: ny + buffer}, {x: nx + buffer, y: ny + buffer}
        ];

        for (const p of points) {
            const c = Math.floor(p.x / cellSize), r = Math.floor(p.y / cellSize);
            if (r < 0 || r >= maze.rows || c < 0 || c >= maze.cols) return true;
            
            const cell = maze.grid[r][c];
            const locX = p.x % cellSize, locY = p.y % cellSize;
            const th = 4; // grubość progu kolizji

            if (cell.walls[0] && locY < th) return true; // Góra
            if (cell.walls[1] && locX > cellSize - th) return true; // Prawo
            if (cell.walls[2] && locY > cellSize - th) return true; // Dół
            if (cell.walls[3] && locX < th) return true; // Lewo
        }
        return false;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        // Cień
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath(); ctx.ellipse(0, 5, this.r, this.r/2, 0, 0, Math.PI*2); ctx.fill();
        // Szata
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI*2); ctx.fill();
        // Okulary
        ctx.fillStyle = "#111"; ctx.fillRect(-this.r*0.6, -2, this.r*0.5, 3); ctx.fillRect(this.r*0.1, -2, this.r*0.5, 3);
        // Czapka (Bucket Hat)
        ctx.fillStyle = "#eee"; ctx.fillRect(-this.r, -this.r, this.r*2, 4); ctx.fillRect(-this.r*0.6, -this.r-4, this.r*1.2, 5);
        ctx.restore();
    }
}

// --- Silnik Gry ---
class Game {
    constructor() {
        this.level = 0;
        this.state = 'TITLE';
        this.initLevel();
        this.loop();
    }

    initLevel() {
        // Skalowanie trudności: więcej kolumn i wierszy na każdym poziomie
        const difficulty = 8 + (this.level * 2); 
        this.maze = new Maze(Math.floor(difficulty * 0.6), difficulty);
        this.cellSize = canvas.width / (this.maze.cols + 1);
        this.player = new Player(this.cellSize);
        this.player.x = this.player.targetX = this.cellSize * 0.5;
        this.player.y = this.player.targetY = this.cellSize * 0.5;
        this.exit = { r: this.maze.rows - 1, c: this.maze.cols - 1 };
    }

    update() {
        if (this.state === 'PLAYING') {
            this.player.update(this.maze, this.cellSize);
            const ex = (this.exit.c + 0.5) * this.cellSize, ey = (this.exit.r + 0.5) * this.cellSize;
            if (Math.hypot(this.player.x - ex, this.player.y - ey) < 15) {
                this.level++;
                if (this.level >= 10) this.state = 'WIN';
                else this.initLevel();
            }
        }
    }

    draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const ld = LEVEL_DATA[this.level] || LEVEL_DATA[0];

        if (this.state === 'TITLE') {
            this.drawOverlay("Wprowadź Mnie Panie", "Dotknij, by zacząć");
            return;
        }

        // Kamera (centrowanie na graczu)
        const scale = 1.5;
        ctx.save();
        ctx.translate(canvas.width/2 - this.player.x * scale, canvas.height/2 - this.player.y * scale);
        ctx.scale(scale, scale);

        // Rysowanie Labiryntu
        ctx.fillStyle = ld.floor;
        ctx.fillRect(0, 0, this.maze.cols * this.cellSize, this.maze.rows * this.cellSize);

        ctx.strokeStyle = ld.wall; ctx.lineWidth = 6; ctx.lineCap = "round";
        for (let r = 0; r < this.maze.rows; r++) {
            for (let c = 0; c < this.maze.cols; c++) {
                const x = c * this.cellSize, y = r * this.cellSize, s = this.cellSize;
                const walls = this.maze.grid[r][c].walls;
                if (walls[0]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s, y); ctx.stroke(); }
                if (walls[1]) { ctx.beginPath(); ctx.moveTo(x + s, y); ctx.lineTo(x + s, y + s); ctx.stroke(); }
                if (walls[2]) { ctx.beginPath(); ctx.moveTo(x, y + s); ctx.lineTo(x + s, y + s); ctx.stroke(); }
                if (walls[3]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + s); ctx.stroke(); }
            }
        }

        // Wyjście
        ctx.fillStyle = "gold"; ctx.font = "20px serif"; ctx.textAlign = "center";
        ctx.fillText("✦", (this.exit.c + 0.5) * this.cellSize, (this.exit.r + 0.5) * this.cellSize + 7);

        this.player.draw(ctx);
        ctx.restore();

        // Fog of War
        if (ld.fog > 0) {
            const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 20, canvas.width/2, canvas.height/2, ld.fog);
            grad.addColorStop(0, "transparent"); grad.addColorStop(1, "black");
            ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width, canvas.height);
        }

        // HUD
        ctx.fillStyle = "#fff"; ctx.font = "bold 14px Georgia"; ctx.textAlign = "left";
        ctx.fillText(`${ld.name} (${this.level + 1}/10)`, 20, 30);
    }

    drawOverlay(t1, t2) {
        ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = "gold"; ctx.textAlign = "center";
        ctx.font = "bold 24px Georgia"; ctx.fillText(t1, canvas.width/2, canvas.height/2 - 20);
        ctx.font = "14px Georgia"; ctx.fillStyle = "#fff"; ctx.fillText(t2, canvas.width/2, canvas.height/2 + 20);
    }

    loop() {
        this.update(); this.draw();
        requestAnimationFrame(() => this.loop());
    }
}

const game = new Game();

// --- Sterowanie ---
function handleInput(e) {
    if (game.state !== 'PLAYING') { game.state = 'PLAYING'; return; }
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    const scale = 1.5;
    // Konwersja ekran -> świat gry
    game.player.targetX = (touch.clientX - rect.left - canvas.width/2) / scale + game.player.x;
    game.player.targetY = (touch.clientY - rect.top - canvas.height/2) / scale + game.player.y;
}

canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(e); }, {passive: false});
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleInput(e); }, {passive: false});
canvas.addEventListener('mousedown', handleInput);

document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
});
</script>
</body>
</html>
